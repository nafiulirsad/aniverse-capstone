name: Android CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    JAVA_VERSION: '25'
    ANDROID_PACKAGES: 'platforms;android-37.0 build-tools;37.0.0'

jobs:
    quality:
        name: Static analysis (ktlint + Android Lint)
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v5

            -   name: Set up JDK
                uses: actions/setup-java@v5
                with:
                    distribution: temurin
                    java-version: ${{ env.JAVA_VERSION }}

            -   name: Set up Android SDK
                uses: android-actions/setup-android@v3
                with:
                    packages: ${{ env.ANDROID_PACKAGES }}

            -   name: Set up Gradle
                uses: gradle/actions/setup-gradle@v5

            -   name: Check code style
                run: ./gradlew ktlintCheck --stacktrace

            -   name: Run Android Lint
                run: ./gradlew lint --stacktrace

            -   name: Upload analysis reports
                if: always()
                uses: actions/upload-artifact@v4
                with:
                    name: static-analysis-reports
                    path: |
                        build/reports/ktlint/
                        */build/reports/lint-results-*.html
                    if-no-files-found: ignore

    test:
        name: Unit tests + coverage
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v5

            -   name: Set up JDK
                uses: actions/setup-java@v5
                with:
                    distribution: temurin
                    java-version: ${{ env.JAVA_VERSION }}

            -   name: Set up Android SDK
                uses: android-actions/setup-android@v3
                with:
                    packages: ${{ env.ANDROID_PACKAGES }}

            -   name: Set up Gradle
                uses: gradle/actions/setup-gradle@v5

            -   name: Run unit tests with coverage
                run: ./gradlew jacocoTestReport --stacktrace

            -   name: Summarise coverage
                if: always()
                run: |
                    python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
                    import glob, xml.etree.ElementTree as ET

                    print("| Module | Line coverage | Lines covered |")
                    print("|---|---|---|")
                    for report in sorted(glob.glob("*/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml")):
                        module = report.split("/")[0]
                        root = ET.parse(report).getroot()
                        for counter in root.findall("counter"):
                            if counter.get("type") != "LINE":
                                continue
                            missed, covered = int(counter.get("missed")), int(counter.get("covered"))
                            total = missed + covered
                            print(f"| `{module}` | {100 * covered / total:.1f}% | {covered}/{total} |")
                    PY

            -   name: Upload test and coverage reports
                if: always()
                uses: actions/upload-artifact@v4
                with:
                    name: test-and-coverage-reports
                    path: |
                        */build/reports/tests/
                        */build/reports/jacoco/
                    if-no-files-found: ignore

    security:
        name: Security analysis (CodeQL + Trivy)
        runs-on: ubuntu-latest
        permissions:
            contents: read
            actions: read
            security-events: write
        steps:
            -   uses: actions/checkout@v5

            -   name: Set up JDK
                uses: actions/setup-java@v5
                with:
                    distribution: temurin
                    java-version: ${{ env.JAVA_VERSION }}

            -   name: Set up Android SDK
                uses: android-actions/setup-android@v3
                with:
                    packages: ${{ env.ANDROID_PACKAGES }}

            -   name: Set up Gradle
                uses: gradle/actions/setup-gradle@v5

            # Static application security testing: CodeQL reads the compiled Kotlin and looks for
            # injection, crypto misuse, and data-flow problems in the app's own code.
            -   name: Create the Android debug keystore
                run: |
                    mkdir -p ~/.android
                    keytool -genkeypair -v \
                        -keystore ~/.android/debug.keystore \
                        -storepass android -keypass android \
                        -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
                        -dname "CN=Android Debug,O=Android,C=US"

            -   name: Initialise CodeQL
                uses: github/codeql-action/init@v4
                with:
                    languages: java-kotlin
                    build-mode: manual
                    queries: security-extended

            -   name: Compile for CodeQL
                run: ./gradlew assembleDebug --stacktrace

            -   name: Run CodeQL analysis
                uses: github/codeql-action/analyze@v4
                with:
                    category: /language:java-kotlin

            # Software composition analysis: known CVEs in the dependencies, plus a scan for
            # credentials accidentally committed to the repository.
            -   name: Scan dependencies and secrets with Trivy
                uses: aquasecurity/trivy-action@v0.36.0
                with:
                    scan-type: fs
                    scanners: vuln,secret,misconfig
                    severity: CRITICAL,HIGH
                    exit-code: '0'
                    format: table

    build:
        name: Build release APK
        runs-on: ubuntu-latest
        needs: [quality, test]
        steps:
            -   uses: actions/checkout@v5

            -   name: Set up JDK
                uses: actions/setup-java@v5
                with:
                    distribution: temurin
                    java-version: ${{ env.JAVA_VERSION }}

            -   name: Set up Android SDK
                uses: android-actions/setup-android@v3
                with:
                    packages: ${{ env.ANDROID_PACKAGES }}

            -   name: Set up Gradle
                uses: gradle/actions/setup-gradle@v5

            # The release build is signed with the standard debug key so the APK in the artifacts
            # can be installed directly; a CI runner has no keystore yet, so create the usual one.
            -   name: Create the Android debug keystore
                run: |
                    mkdir -p ~/.android
                    keytool -genkeypair -v \
                        -keystore ~/.android/debug.keystore \
                        -storepass android -keypass android \
                        -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
                        -dname "CN=Android Debug,O=Android,C=US"

            # `assembleRelease` is the build that matters: it is the one that runs R8, so a broken
            # ProGuard rule fails the pipeline instead of the reviewer's device.
            -   name: Build obfuscated release APK
                run: ./gradlew assembleRelease --stacktrace

            -   name: Build debug APK
                run: ./gradlew assembleDebug --stacktrace

            -   name: Upload APKs and the R8 mapping file
                uses: actions/upload-artifact@v4
                with:
                    name: aniverse-apk
                    path: |
                        app/build/outputs/apk/release/*.apk
                        app/build/outputs/apk/debug/*.apk
                        app/build/outputs/mapping/release/mapping.txt
